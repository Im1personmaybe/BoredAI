name: Keep Render Site Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render site
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            -A "GitHubActions-RenderKeepAlive" \
            https://boredai.onrender.com/
